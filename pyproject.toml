[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strata"
version = "0.5.0"
description = "Deterministic, rigging-first 2D engine core — simple surface, rigorous internals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.4.0",
    "pymunk>=6.6.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
gpu = ["cupy>=13.0.0"]
dev = ["pytest>=8.0.0", "pytest-cov"]

[project.urls]
Repository = "https://github.com/aadit/stratakinesis"

[tool.hatch.build.targets.wheel]
packages = ["strata"]
